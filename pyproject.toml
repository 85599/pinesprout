[build-system]
requires = ["hatchling>=1.21.0"]
build-backend = "hatchling.build"

[project]
name = "pinesprout"
version = "0.1.0"
description = "A production-grade CLI toolkit for TradingView Pine Script developers: generate, format, lint, analyze, optimize, upgrade, and document Pine Script."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "PineSprout Contributors" }
]
keywords = ["pine-script", "tradingview", "cli", "linter", "formatter", "trading"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Compilers",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Office/Business :: Financial :: Investment",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.12.3",
    "rich>=13.7.1",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.1",
    "jinja2>=3.1.4",
    "shellingham>=1.5.4",
    "httpx>=0.27.0",
    "tomli>=2.0.1; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.10.0",
    "ruff>=0.4.4",
    "types-jinja2",
    "streamlit>=1.38",
    "yfinance>=0.2.40",
    "plotly>=5.20",
    "streamlit-autorefresh>=1.0.1",
    "pandas>=2.0",
]
streamlit = [
    "streamlit>=1.38",
    "yfinance>=0.2.40",
    "plotly>=5.20",
    "streamlit-autorefresh>=1.0.1",
    "pandas>=2.0",
]

[project.urls]
Homepage = "https://github.com/85599/pinesprout"
Documentation = "https://github.com/85599/pinesprout#readme"
Repository = "https://github.com/85599/pinesprout"
Issues = "https://github.com/85599/pinesprout/issues"
Changelog = "https://github.com/85599/pinesprout/blob/main/CHANGELOG.md"

[project.scripts]
pinesprout = "pinesprout.cli:app"
psp = "pinesprout.cli:app"
pf = "pinesprout.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["pinesprout"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B024", "UP042", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
