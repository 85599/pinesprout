name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install package (with dev extras)
        run: pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check pinesprout tests

      - name: Mypy (strict type-check)
        run: mypy pinesprout

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    needs: lint-and-typecheck
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install package (with dev extras)
        run: pip install -e ".[dev]"

      - name: Run test suite
        run: pytest --cov=pinesprout --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  smoke-test-cli:
    name: CLI smoke test
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install package
        run: pip install .

      - name: Verify CLI entry points
        run: |
          pinesprout --version
          pf --version
          pinesprout --help
          pinesprout template list
          pinesprout template new blank-indicator --output /tmp/demo.pine
          pinesprout lint /tmp/demo.pine
          pinesprout format /tmp/demo.pine
          pinesprout analyze /tmp/demo.pine
          pinesprout explain /tmp/demo.pine --summary
          pinesprout docs /tmp/demo.pine --format markdown
